name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The toolchain needs a recent Node: pnpm 11 requires 22.13+.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `version` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # `engines` promises Node 18.17+ to consumers. That is a claim about the
  # published artifact, not about the build, so it gets tested separately with
  # plain Node and no devDependencies.
  compat:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.17', '20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: node scripts/ci/import-check.mjs
